name: OCI Start – Continuous Retry (up to 6 hours)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

env:
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"

jobs:
  start-instance:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OCI CLI
        run: |
          curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh \
            | bash -s -- --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Write OCI credentials
        run: |
          mkdir -p ~/.oci
          cat > ~/.oci/oci_api_private_key.pem <<'EOF'
          ${{ secrets.OCI_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.oci/oci_api_private_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_private_key.pem
          EOF

      - name: Validate instance ID
        env:
          INSTANCE_ID: ${{ secrets.OCI_INSTANCE_ID }}
        run: |
          if [ -z "$INSTANCE_ID" ]; then
            echo "❌ OCI_INSTANCE_ID secret is empty" >&2
            exit 1
          fi
          echo "✅ Instance ID: ${INSTANCE_ID:0:8}..."

      - name: Continuous retry until RUNNING (or 6h timeout)
        env:
          INSTANCE_ID: ${{ secrets.OCI_INSTANCE_ID }}
        run: |
          set +e
          START_EPOCH=$(date +%s)
          SIX_HOURS=21600
          RETRY_DELAY=10       # seconds between full start attempts
          STATE_CHECK_DELAY=5  # seconds between state checks after a start
          ATTEMPT=0

          while true; do
            ATTEMPT=$((ATTEMPT + 1))
            NOW=$(date +%s)
            ELAPSED=$((NOW - START_EPOCH))

            if [ $ELAPSED -gt $SIX_HOURS ]; then
              echo "⏹️ 6‑hour limit reached – exiting."
              exit 0
            fi

            echo ""
            echo "--- Attempt #$ATTEMPT (${ELAPSED}s elapsed) ---"

            # Get current state (clean)
            STATE=$(oci compute instance get --instance-id "$INSTANCE_ID" --query 'data."lifecycle-state"' --raw-output 2>/dev/null)
            echo "📌 Instance state: $STATE"

            if [ "$STATE" == "RUNNING" ]; then
              echo "✅ Instance is already RUNNING – success!"
              exit 0
            elif [ "$STATE" == "STOPPED" ]; then
              echo "🚀 Sending start command..."
              # Run start without waiting – capture output and exit code
              OUTPUT=$(oci compute instance action --action START --instance-id "$INSTANCE_ID" 2>&1)
              EXIT_CODE=$?

              if [ $EXIT_CODE -eq 0 ]; then
                echo "✅ Start command accepted (202 Accepted). Waiting for instance to become RUNNING..."
                # Now wait for RUNNING with our own loop
                WAIT_START=$(date +%s)
                WAIT_TIMEOUT=300  # 5 minutes max wait for state change
                while true; do
                  NOW_WAIT=$(date +%s)
                  if [ $((NOW_WAIT - WAIT_START)) -gt $WAIT_TIMEOUT ]; then
                    echo "⏰ Timeout waiting for RUNNING state. Will retry later."
                    break
                  fi
                  CURRENT_STATE=$(oci compute instance get --instance-id "$INSTANCE_ID" --query 'data."lifecycle-state"' --raw-output 2>/dev/null)
                  echo "   ➜ Current state: $CURRENT_STATE"
                  if [ "$CURRENT_STATE" == "RUNNING" ]; then
                    echo "✅ Instance reached RUNNING – success!"
                    exit 0
                  elif [ "$CURRENT_STATE" == "STOPPED" ] || [ "$CURRENT_STATE" == "STOPPING" ]; then
                    # If it went back to STOPPED, the start failed (e.g., capacity)
                    echo "   ⚠️ Instance reverted to $CURRENT_STATE – start likely failed."
                    break
                  fi
                  sleep $STATE_CHECK_DELAY
                done
              else
                # Start command failed – extract the error message
                ERROR_MSG=$(echo "$OUTPUT" | grep -i "serviceerror" | tail -1 || echo "$OUTPUT" | tail -3)
                echo "❌ Start command failed (exit $EXIT_CODE). Error: $ERROR_MSG"
              fi
            elif [ "$STATE" == "STOPPING" ] || [ "$STATE" == "STARTING" ]; then
              echo "⏳ Instance is $STATE – waiting for it to settle."
              # Wait a bit before checking again
              sleep $STATE_CHECK_DELAY
              continue
            else
              echo "⚠️ Unhandled state: $STATE – waiting ${RETRY_DELAY}s."
            fi

            echo "⏳ Sleeping $RETRY_DELAY seconds before next attempt..."
            sleep $RETRY_DELAY
          done
