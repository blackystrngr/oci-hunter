name: OCI Start – Continuous Retry (up to 6 hours)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

env:
  PYTHONUNBUFFERED: "1"   # flush stdout/stderr immediately instead of buffering

jobs:
  start-instance:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start instance (continuous retry until RUNNING or 6h timeout)
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_INSTANCE_ID: ${{ secrets.OCI_INSTANCE_ID }}
        run: python startvps.py
