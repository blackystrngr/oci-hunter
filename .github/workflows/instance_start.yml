name: OCI Start – Continuous Retry (up to 6 hours)

on:
  workflow_dispatch:               # manual start
  schedule:
    - cron: '0 0 * * *'            # optional daily run

env:
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"

jobs:
  start-instance:
    runs-on: ubuntu-latest
    timeout-minutes: 360           # 6 hours
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OCI CLI
        run: |
          curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh \
            | bash -s -- --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Write OCI credentials
        run: |
          mkdir -p ~/.oci
          cat > ~/.oci/oci_api_private_key.pem <<'EOF'
          ${{ secrets.OCI_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.oci/oci_api_private_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_private_key.pem
          EOF

      - name: Validate instance ID
        env:
          INSTANCE_ID: ${{ secrets.OCI_INSTANCE_ID }}
        run: |
          if [ -z "$INSTANCE_ID" ]; then
            echo "❌ OCI_INSTANCE_ID secret is empty" >&2
            exit 1
          fi
          echo "✅ Instance ID: ${INSTANCE_ID:0:8}..."

      - name: Continuous retry until RUNNING (or 6h timeout)
        env:
          INSTANCE_ID: ${{ secrets.OCI_INSTANCE_ID }}
        run: |
          set +e
          START_EPOCH=$(date +%s)
          SIX_HOURS=21600
          DELAY=10
          ATTEMPT=0

          while true; do
            ATTEMPT=$((ATTEMPT + 1))
            NOW=$(date +%s)
            ELAPSED=$((NOW - START_EPOCH))

            if [ $ELAPSED -gt $SIX_HOURS ]; then
              echo "⏹️ 6‑hour limit reached – exiting."
              exit 0
            fi

            echo ""
            echo "--- Attempt #$ATTEMPT (${ELAPSED}s elapsed) ---"

            # Get current state (clean, no extra logs)
            STATE=$(oci compute instance get --instance-id "$INSTANCE_ID" --query 'data."lifecycle-state"' --raw-output 2>/dev/null)
            echo "📌 Instance state: $STATE"

            if [ "$STATE" == "RUNNING" ]; then
              echo "✅ Instance is already RUNNING – success!"
              exit 0
            elif [ "$STATE" == "STOPPED" ]; then
              echo "🚀 Attempting to start..."
              # Run the start command without --debug – it prints its own clean error messages.
              # Capture both stdout and stderr so we can show the error text.
              OUTPUT=$(oci compute instance action --action START --instance-id "$INSTANCE_ID" \
                --wait-for-state RUNNING --max-wait-seconds 300 2>&1)
              EXIT_CODE=$?

              if [ $EXIT_CODE -eq 0 ]; then
                echo "✅ Instance started successfully and reached RUNNING."
                exit 0
              else
                # Extract the error message (the CLI usually prints "ServiceError: {...}")
                # We'll just print the last few lines of output.
                ERROR_MSG=$(echo "$OUTPUT" | grep -i "serviceerror" | tail -1 || echo "$OUTPUT" | tail -5)
                echo "❌ Start failed. Error: $ERROR_MSG"
                echo "   Will retry in ${DELAY}s..."
              fi
            elif [ "$STATE" == "STOPPING" ] || [ "$STATE" == "STARTING" ]; then
              echo "⏳ Instance is $STATE – waiting for it to become STOPPED or RUNNING."
            else
              echo "⚠️ Unhandled state: $STATE – waiting ${DELAY}s."
            fi

            echo "⏳ Sleeping $DELAY seconds..."
            sleep $DELAY
          done
