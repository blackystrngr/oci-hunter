name: OCI Start – Continuous Retry (up to 6 hours)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

env:
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
  OCI_CLI_MAX_RETRIES: "0"          # disable retries to avoid hanging

jobs:
  start-instance:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OCI CLI
        run: |
          curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh \
            | bash -s -- --accept-all-defaults
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Write OCI credentials
        run: |
          mkdir -p ~/.oci
          cat > ~/.oci/oci_api_private_key.pem <<'EOF'
          ${{ secrets.OCI_PRIVATE_KEY }}
          EOF

          # Fix common paste issues: CRLF line endings and literal \n sequences
          sed -i 's/\r$//' ~/.oci/oci_api_private_key.pem
          if ! grep -q "BEGIN" ~/.oci/oci_api_private_key.pem; then
            echo "❌ Private key doesn't look like a PEM file after write. Check OCI_PRIVATE_KEY secret formatting." >&2
            exit 1
          fi
          # Collapse an accidentally single-line key (literal \n chars) back into real newlines
          if [ "$(wc -l < ~/.oci/oci_api_private_key.pem)" -le 1 ]; then
            sed -i 's/\\n/\n/g' ~/.oci/oci_api_private_key.pem
          fi
          chmod 600 ~/.oci/oci_api_private_key.pem

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_private_key.pem
          EOF
          chmod 600 ~/.oci/config

          # Validate the PEM is actually parseable before trusting it for hours of retries
          if ! openssl rsa -in ~/.oci/oci_api_private_key.pem -check -noout 2>/dev/null \
             && ! openssl pkey -in ~/.oci/oci_api_private_key.pem -noout 2>/dev/null; then
            echo "❌ OCI_PRIVATE_KEY is not a valid PEM private key (openssl couldn't parse it)." >&2
            exit 1
          fi

      - name: Validate instance ID
        env:
          INSTANCE_ID: ${{ secrets.OCI_INSTANCE_ID }}
        run: |
          if [ -z "$INSTANCE_ID" ]; then
            echo "❌ OCI_INSTANCE_ID secret is empty" >&2
            exit 1
          fi
          echo "✅ Instance ID: ${INSTANCE_ID:0:8}..."

      - name: Verify OCI CLI auth works (fail fast, don't burn 6h on bad creds)
        run: |
          if ! command -v oci >/dev/null 2>&1; then
            echo "❌ oci CLI not found on PATH after install." >&2
            exit 1
          fi
          oci --version
          if ! oci iam region list >/tmp/region_check.json 2>/tmp/region_check.err; then
            echo "❌ Auth check failed. This means your OCI credentials/config are wrong — retrying won't help." >&2
            cat /tmp/region_check.err >&2
            exit 1
          fi
          echo "✅ OCI credentials are valid."

      - name: Continuous retry until RUNNING (or 6h timeout)
        env:
          INSTANCE_ID: ${{ secrets.OCI_INSTANCE_ID }}
        run: |
          set +e
          START_EPOCH=$(date +%s)
          SIX_HOURS=21600
          RETRY_DELAY=10
          STATE_CHECK_DELAY=5
          ATTEMPT=0

          while true; do
            ATTEMPT=$((ATTEMPT + 1))
            NOW=$(date +%s)
            ELAPSED=$((NOW - START_EPOCH))

            if [ $ELAPSED -gt $SIX_HOURS ]; then
              echo "⏹️ 6‑hour limit reached – exiting."
              exit 0
            fi

            echo ""
            echo "--- Attempt #$ATTEMPT (${ELAPSED}s elapsed) ---"

            STATE=$(oci compute instance get --instance-id "$INSTANCE_ID" --query 'data."lifecycle-state"' --raw-output 2>/tmp/get_state.err)
            if [ -z "$STATE" ]; then
              echo "⚠️ Couldn't read instance state. Error:"
              tail -3 /tmp/get_state.err
            fi
            echo "📌 Instance state: $STATE"

            if [ "$STATE" == "RUNNING" ]; then
              echo "✅ Instance is already RUNNING – success!"
              exit 0
            elif [ "$STATE" == "STOPPED" ]; then
              echo "🚀 Sending start command (timeout 60s)..."
              timeout 60 oci compute instance action \
                --action START --instance-id "$INSTANCE_ID" \
                --connection-timeout 10 --read-timeout 30 \
                2>&1 | tee /tmp/oci_out
              EXIT_CODE=${PIPESTATUS[0]}
              OUTPUT=$(cat /tmp/oci_out)

              if [ $EXIT_CODE -eq 124 ]; then
                echo "⏰ Timeout: start command took >60 seconds. Partial output (if any):"
                cat /tmp/oci_out
              elif [ $EXIT_CODE -eq 0 ]; then
                echo "✅ Start command accepted (202 Accepted). Waiting for RUNNING..."
                WAIT_START=$(date +%s)
                WAIT_TIMEOUT=300
                while true; do
                  NOW_WAIT=$(date +%s)
                  if [ $((NOW_WAIT - WAIT_START)) -gt $WAIT_TIMEOUT ]; then
                    echo "⏰ Timeout waiting for RUNNING. Will retry."
                    break
                  fi
                  CURRENT_STATE=$(oci compute instance get --instance-id "$INSTANCE_ID" --query 'data."lifecycle-state"' --raw-output 2>/dev/null)
                  echo "   ➜ Current state: $CURRENT_STATE"
                  if [ "$CURRENT_STATE" == "RUNNING" ]; then
                    echo "✅ Instance reached RUNNING – success!"
                    exit 0
                  elif [ "$CURRENT_STATE" == "STOPPED" ] || [ "$CURRENT_STATE" == "STOPPING" ]; then
                    echo "   ⚠️ Instance went back to $CURRENT_STATE – start likely failed."
                    break
                  fi
                  sleep $STATE_CHECK_DELAY
                done
              else
                ERROR_MSG=$(echo "$OUTPUT" | grep -i "serviceerror" | tail -1)
                if [ -z "$ERROR_MSG" ]; then
                  ERROR_MSG=$(echo "$OUTPUT" | tail -3)
                fi
                echo "❌ Start command failed (exit $EXIT_CODE). Error: $ERROR_MSG"
              fi
            elif [ "$STATE" == "STOPPING" ] || [ "$STATE" == "STARTING" ]; then
              echo "⏳ Instance is $STATE – waiting for it to settle."
              sleep $STATE_CHECK_DELAY
              continue
            else
              echo "⚠️ Unhandled state: $STATE – waiting ${RETRY_DELAY}s."
            fi

            echo "⏳ Sleeping $RETRY_DELAY seconds before next attempt..."
            sleep $RETRY_DELAY
          done
