name: OCI Start Instance (Every Minute, 6‑hour Limit)

on:
  workflow_dispatch:                 # manual trigger
  schedule:
    - cron: '* * * * *'              # runs every minute

concurrency:
  group: oci-start-instance
  cancel-in-progress: false

env:
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"   # hide .oci/config warning

jobs:
  start-instance:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- 6‑hour safety limit ---
      - name: Check time limit
        id: time_check
        run: |
          TIMESTAMP_FILE="start_time.txt"
          CURRENT_EPOCH=$(date +%s)
          SIX_HOURS=21600

          if [ ! -f "$TIMESTAMP_FILE" ]; then
            echo "$CURRENT_EPOCH" > "$TIMESTAMP_FILE"
            echo "should_continue=true" >> $GITHUB_OUTPUT
          else
            START_EPOCH=$(cat "$TIMESTAMP_FILE")
            ELAPSED=$((CURRENT_EPOCH - START_EPOCH))
            if [ $ELAPSED -gt $SIX_HOURS ]; then
              echo "should_continue=false" >> $GITHUB_OUTPUT
            else
              echo "should_continue=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Persist timestamp
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add start_time.txt 2>/dev/null || true
          git commit -m "Update start_time [skip ci]" 2>/dev/null || true
          git push 2>/dev/null || true

      - name: Stop after 6 hours
        if: steps.time_check.outputs.should_continue == 'false'
        run: echo "⏹️ 6‑hour limit reached – no further start attempts." && exit 0

      # --- Install OCI CLI (non‑interactive) ---
      - name: Install OCI CLI
        run: |
          curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh \
            | bash -s -- --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH

      # --- Write credentials ---
      - name: Write OCI credentials
        run: |
          mkdir -p ~/.oci
          cat > ~/.oci/oci_api_private_key.pem <<'EOF'
          ${{ secrets.OCI_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.oci/oci_api_private_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_private_key.pem
          EOF

      # --- Validate instance ID ---
      - name: Validate instance ID
        id: validate
        env:
          INSTANCE_ID: ${{ secrets.OCI_INSTANCE_ID }}
        run: |
          if [ -z "$INSTANCE_ID" ]; then
            echo "❌ OCI_INSTANCE_ID secret is empty or missing." >&2
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "✅ Instance ID found: ${INSTANCE_ID:0:8}..."
            echo "valid=true" >> $GITHUB_OUTPUT
          fi

      - name: Abort if invalid
        if: steps.validate.outputs.valid == 'false'
        run: exit 1

      # --- Check current state (safe, clean output) ---
      - name: Check current state
        id: check_state
        env:
          INSTANCE_ID: ${{ secrets.OCI_INSTANCE_ID }}
        run: |
          STATE=$(oci compute instance get --instance-id "$INSTANCE_ID" --query 'data."lifecycle-state"' --raw-output)
          echo "📌 Current state: $STATE"
          echo "state=$STATE" >> $GITHUB_OUTPUT

      - name: Already RUNNING – skip
        if: steps.check_state.outputs.state == 'RUNNING'
        run: echo "✅ Instance is already RUNNING – nothing to do."

      - name: Instance is STOPPING – skip for now
        if: steps.check_state.outputs.state == 'STOPPING'
        run: echo "⏳ Instance is STOPPING – will retry next minute."

      # --- Only attempt start if STOPPED ---
      - name: Attempt start (only if STOPPED)
        if: steps.check_state.outputs.state == 'STOPPED'
        env:
          INSTANCE_ID: ${{ secrets.OCI_INSTANCE_ID }}
        run: |
          echo "🚀 Starting instance $INSTANCE_ID ..."
          # Don't let temporary errors fail the job
          set +e
          oci compute instance action --action START --instance-id "$INSTANCE_ID" \
            --wait-for-state RUNNING --max-wait-seconds 300 2>&1
          EXIT_CODE=$?
          set -e

          # Print clean final state
          NEW_STATE=$(oci compute instance get --instance-id "$INSTANCE_ID" --query 'data."lifecycle-state"' --raw-output)
          echo "📊 Final state after attempt: $NEW_STATE"

          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Start successful – instance reached RUNNING."
          else
            echo "⚠️ Start command exited with code $EXIT_CODE (likely capacity or conflict)."
            echo "   Will retry on the next scheduled run (in 1 minute)."
          fi

      - name: State not actionable
        if: steps.check_state.outputs.state != 'RUNNING' && steps.check_state.outputs.state != 'STOPPED' && steps.check_state.outputs.state != 'STOPPING'
        run: echo "⚠️ Instance is in '${{ steps.check_state.outputs.state }}' – cannot start."

      # --- Final state (always shown) ---
      - name: Final instance state
        if: always()
        env:
          INSTANCE_ID: ${{ secrets.OCI_INSTANCE_ID }}
        run: |
          STATE=$(oci compute instance get --instance-id "$INSTANCE_ID" --query 'data."lifecycle-state"' --raw-output)
          echo "📊 Final instance state: $STATE"
